name: Release workflow

on:
  push:
    branches:
      - master

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: ^1.25

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Install Protoc
      uses: arduino/setup-protoc@v3.0.0
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Get protoc go binaries
      run: make tools

    - name: Genereate code for infrabin protofile
      run: make protoc

    - name: Run semantic-release
      id: semantic
      uses: cycjimmy/semantic-release-action@v8
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to DockerHub
      if: steps.semantic.outputs.new_release_published == 'true'
      uses: docker/login-action@v4.8.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Login to GitHub Packages
      if: steps.semantic.outputs.new_release_published == 'true'
      uses: docker/login-action@v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push tagged docker image on master
      if: steps.semantic.outputs.new_release_published == 'true'
      uses: docker/build-push-action@v7.4.0
      with:
        push: true
        platforms: linux/amd64,linux/arm64
        tags: |
          docker.io/maruina/go-infrabin:v${{ steps.semantic.outputs.new_release_version }}
          ghcr.io/maruina/go-infrabin:v${{ steps.semantic.outputs.new_release_version }}

    - name: Check images
      if: steps.semantic.outputs.new_release_published == 'true'
      run: |
        docker buildx imagetools inspect docker.io/maruina/go-infrabin:v${{ steps.semantic.outputs.new_release_version }}
        docker buildx imagetools inspect ghcr.io/maruina/go-infrabin:v${{ steps.semantic.outputs.new_release_version }}

    - name: Run GoReleaser
      if: steps.semantic.outputs.new_release_published == 'true'
      uses: goreleaser/goreleaser-action@v7.3.0
      with:
        version: '~> v2'
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install yq
      if: steps.semantic.outputs.new_release_published == 'true'
      run: |
        curl -sL -o yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        chmod +x yq
        sudo mv yq /usr/local/bin/yq

    - name: Sync chart version with release version
      if: steps.semantic.outputs.new_release_published == 'true'
      run: yq -i '.version = "${{ steps.semantic.outputs.new_release_version }}" | .appVersion = "v${{ steps.semantic.outputs.new_release_version }}"' charts/go-infrabin/Chart.yaml

    - name: Install Helm
      if: steps.semantic.outputs.new_release_published == 'true'
      uses: azure/setup-helm@v5.1.0

    - name: Login to GitHub Packages
      if: steps.semantic.outputs.new_release_published == 'true'
      run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.repository_owner }} --password-stdin

    - name: Package chart
      if: steps.semantic.outputs.new_release_published == 'true'
      run: helm package charts/go-infrabin

    - name: Push chart to GitHub Packages
      if: steps.semantic.outputs.new_release_published == 'true'
      run: helm push go-infrabin-${{ steps.semantic.outputs.new_release_version }}.tgz oci://ghcr.io/maruina
